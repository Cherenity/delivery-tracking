spring.application.name=delivery-tracking

spring.datasource.url=jdbc:postgresql://localhost:5432/pawtrack
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234

# Taulut luodaan schema.sql-tiedostolla ja data lisätään data.sql-tiedostolla
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.show-sql=true

# SQL-tiedostojen sijainnit
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

