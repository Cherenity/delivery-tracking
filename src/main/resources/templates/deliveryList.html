<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>My Deliveries</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <!-- Yhteinen header -->
  <div th:replace="~{header :: header}"></div>

  <main>
    <h2>Delivery List</h2>

    <!-- Aloittaa päivän toimitukset -->
    <p>
      Today's Deliveries
      (<span th:text="${#temporals.format(today, 'dd.MM.yyyy')}"></span>):
      <span th:text="${orders.size()}"></span>
    </p>
    <br></br>

    <form th:if="${assignedCount > 0}" th:action="@{/deliveryList/{userId}/start(userId=${userId})}" method="post">

      <button type="submit">Start Deliveries</button>

    </form>


    <!-- Näytetään kuljettajan tilaukset -->
    <div th:each="order : ${orders}" class="delivery-card">

      <div class="delivery-info">

        <div>
          <strong>Customer: </strong>
          <span th:text="${order.customer}"></span>
        </div>

        <div style="padding-top: 8px;">
          <strong>Address: </strong>
          <a th:href="@{https://www.google.com/maps/search/(api=1,query=${order.address})}" th:text="${order.address}">
          </a>
        </div>

      </div>

      <span th:text="${order.status}"></span>

      <!-- Toimituksen tilan päivittäminen -->
      <form th:if="${order.status.name() != 'ASSIGNED'}" th:action="@{/deliveryList/{userId}/status(userId=${userId})}"
        method="post">

        <input type="hidden" name="orderId" th:value="${order.id}">

        <select name="status">
          <option value="DELIVERED" th:selected="${order.status.name() == 'DELIVERED'}">
            Delivered
          </option>

          <option value="FAILED_DELIVERY" th:selected="${order.status.name() == 'FAILED_DELIVERY'}">
            Failed Delivery
          </option>
        </select>

        <button type="submit">Save</button>
      </form>


    </div>

  </main>

</body>

</html>
