<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
  <meta charset="UTF-8">
  <title>Assign Drivers | Delivery Tracking</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <!-- Yhteinen header -->
  <div th:replace="~{header :: header}"></div>

  <main>

    <h2><i class="bi bi-truck" style="margin-right: 10px;"></i> Assign Deliveries</h2>
    <p>Select unassigned orders and assign them to a driver.</p>

    <!-- Usean tilauksen määritys -->
    <form th:action="@{/assignMultiple}" method="post">

      <!-- Rullattava tilauslista -->
      <div class="scrollable-table">

        <table>
          <thead>
            <tr>
              <th>Select</th>
              <th>Order</th>
              <th>Customer</th>
              <th>Address</th>
              <th>Delivery Date</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="order : ${orders}">
              <td>
                <input type="checkbox" name="orderIds" th:value="${order.id}">
              </td>
              <td th:text="${order.id}"></td>
              <td th:text="${order.customer}"></td>
              <td th:text="${order.address}"></td>
              <td th:text="${order.deliveryDate}"></td>
            </tr>
          </tbody>
        </table>

      </div>

      <p th:if="${#lists.isEmpty(orders)}">
        No unassigned orders.
      </p>

      <h3>Assign to Driver</h3>

      <label for="userId">Driver:</label>

      <select id="userId" name="userId" required>
        <option value="">Select Driver</option>

        <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}">
        </option>
      </select>

      <button type="submit" style="margin-bottom: 20px;">
        <i class="bi bi-person-check" style="margin-right: 8px;"></i> Assign Selected
      </button>

    </form>

    <!-- Takaisin tilauslistaan -->
    <form th:action="@{/orders}" method="get" style="margin-top: 20px;">
      <button type="submit">
        <i class="bi bi-arrow-left"></i> Back to Orders
      </button>
    </form>

  </main>

</body>

</html>
