<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Order Management</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <header>
    <h1>Order Management</h1>
  </header>

  <main>
    <h2>Add New Order</h2>

    <form th:action="@{/orderList}" th:object="${order}" method="post">

      <div>
        <label for="customer">Customer:</label>
        <input type="text" id="customer" th:field="*{customer}">
        <span class="error" th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}">Customer Error</span>
      </div>

      <div>
        <label for="address">Address:</label>
        <input type="text" id="address" th:field="*{address}">
        <span class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Address Error</span>
      </div>


      <div>
        <label for="deliveryDate">Delivery Date:</label>
        <input type="date" id="deliveryDate" th:field="*{deliveryDate}">
        <span class="error" th:if="${#fields.hasErrors('deliveryDate')}" th:errors="*{deliveryDate}">Delivery Date
          Error</span>
      </div>


      <button type="submit">Add Order</button>

    </form>

    <h2>Orders</h2>

    <table>
      <thead>
        <tr>
          <th>Order</th>
          <th>Customer</th>
          <th>Address</th>
          <th>Delivery date</th>
          <th>Status</th>
          <th>Assign driver</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="order : ${orders}">
          <td th:text="${order.id}"></td>
          <td th:text="${order.customer}"></td>
          <td th:text="${order.address}"></td>
          <td th:text="${order.deliveryDate}"></td>
          <td th:text="${order.status}"></td>

          <td>
            <form th:action="@{/assignDriver}" method="post">

              <input type="hidden" name="orderId" th:value="${order.id}">

              <select name="userId" th:classappend="${order.user == null} ? 'highlight-red' : 'highlight-green'">
                <option value="" th:selected="${order.user == null}">Unassigned</option>


                <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"
                  th:selected="${order.user != null and order.user.id == user.id}">
                </option>
                <!-- näytetään käyttäjä, jos määritetty ^ -->
              </select>

              <button type="submit">Save</button>

            </form>
          </td>
          <!-- Testaukseen: <td th:text="${order.user != null ? order.user.username : 'Unassigned'}"></td> -->

          <td>
            <a th:href="@{/modifyOrder/{id}(id=${order.id})}" class="edit-button">
              <i class="bi bi-pencil-square"></i> Modify
            </a>
          </td>


        </tr>
      </tbody>
    </table>

  </main>

</body>

</html>
