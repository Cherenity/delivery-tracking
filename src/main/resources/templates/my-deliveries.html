<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>My Deliveries</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <!-- Yhteinen header -->
  <div th:replace="~{header :: header}"></div>

  <main>
    <h2>Delivery List</h2>

    <!-- Aloittaa päivän toimitukset -->
    <p>
      Today's Deliveries
      (<span th:text="${#temporals.format(today, 'dd.MM.yyyy')}"></span>):
      <span th:text="${orders.size()}"></span>
    </p>
    <br></br>

    <form th:if="${assignedCount > 0}" th:action="@{/myDeliveries/{userId}/start(userId=${userId})}" method="post">

      <button type="submit">Start Deliveries</button>

    </form>


    <!-- Näytetään kuljettajan tilaukset -->
    <div th:each="order : ${orders}" class="delivery-card">

      <div class="delivery-info">

        <div>
          <strong>Customer: </strong>
          <span th:text="${order.customer}"></span>
        </div>

        <div style="padding-top: 8px;">
          <strong>Address: </strong>
          <a th:href="@{https://www.google.com/maps/search/(api=1,query=${order.address})}" th:text="${order.address}">
          </a>
        </div>

      </div>

      <span th:text="${order.status}"></span>

      <!-- Toimituksen tilan päivittäminen -->
      <form th:if="${order.status.name() == 'IN_PROGRESS'}"
        th:action="@{/myDeliveries/{userId}/status(userId=${userId})}" method="post">

        <input type="hidden" name="orderId" th:value="${order.id}">

        <button type="submit" name="status" value="DELIVERED">
          Delivered
        </button>

        <button type="submit" name="status" value="FAILED_DELIVERY">
          Failed Delivery
        </button>

      </form>

      <span th:if="${order.completedAt != null}" th:text="${#temporals.format(order.completedAt, 'dd.MM.yyyy HH:mm')}">
      </span>


      <!-- Toimituksen tilan päivittäminen (Vanha tässä USER voisi vaihdella)
      <form th:if="${order.status.name() == 'IN_PROGRESS'
           or order.status.name() == 'DELIVERED'
           or order.status.name() == 'FAILED_DELIVERY'}" th:action="@{/myDeliveries/{userId}/status(userId=${userId})}"
        method="post">

        <input type="hidden" name="orderId" th:value="${order.id}">

        <button type="submit" name="status" value="DELIVERED">
          Delivered
        </button>

        <button type="submit" name="status" value="FAILED_DELIVERY">
          Failed Delivery
        </button>

      </form> -->


    </div>

  </main>

</body>

</html>
