<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Modify Order</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <header>
    <h1>Modify Order</h1>
  </header>

  <main>

    <h2>Edit Order</h2>

    <p>Order ID: <span th:text="${order.id}"></span></p>
    <p>Status: <span th:text="${order.status}"></span></p>

    <form th:action="@{/updateOrder}" th:object="${order}" method="post">

      <input type="hidden" th:field="*{id}">

      <div>
        <label for="customer">Customer:</label>
        <input type="text" id="customer" th:field="*{customer}" required>
      </div>

      <div>
        <label for="address">Address:</label>
        <input type="text" id="address" th:field="*{address}" required>
      </div>

      <div>
        <label for="deliveryDate">
          Delivery Date:
          <!-- <span
            th:text="${order.deliveryDate != null ? #temporals.format(order.deliveryDate, 'dd.MM.yyyy') : 'Not set'}"></span> -->
        </label>

        <input type="date" id="deliveryDate" th:field="*{deliveryDate}" required>
      </div>
      
      <button type="submit">Save Changes</button>

    </form>

    <h2>Delete Order</h2>

    <form th:action="@{/deleteOrder/{id}(id=${order.id})}" method="post">

      <button type="submit" onclick="return confirm('Are you sure you want to delete this order?')">
        Delete Order
      </button>

    </form>

    <p>
      <a th:href="@{/orderList}">Back to Order List</a>
    </p>

  </main>

</body>

</html>
